name: portfolio-bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python bot_portfolio.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_USERNAME: ${{ secrets.MY_USERNAME }}
